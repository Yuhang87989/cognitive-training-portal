server {
    listen 80;
    server_name qiuyhang1688.com.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name qiuyhang1688.com.cn;

    ssl_certificate     /etc/letsencrypt/live/qiuyhang1688.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qiuyhang1688.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/portal;
    index index.html;

    location = /SRLdZZuoKM.txt {
        default_type text/plain;
        return 200 "d2e554009d62864586f42520c2bbd76f";
    }
    location = /d2e554009d62864586f42520c2bbd76f.txt {
        default_type text/plain;
        return 200 "d2e554009d62864586f42520c2bbd76f";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|mp3|mp4|json)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
